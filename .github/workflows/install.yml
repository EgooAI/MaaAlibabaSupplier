name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - “frontend/**"
      - "backend/**"
      - "tools/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - “frontend/**"
      - "backend/**"
      - "tools/**"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: set_tag
        shell: bash
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" "${{ github.ref }}" || true)
          if [[ $tag != v* ]]; then
            latest_tag=$(git tag --list "v*" --sort=-version:refname | head -n 1)
            if [[ $latest_tag != v* ]]; then
              latest_tag="v0.0.0"
            fi
            tag=$(date "+$latest_tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if [[ "$is_release" != "true" ]]; then
            prefix=${tag%-*-*}
            suffix=${tag#"$prefix"-}
            tag="$prefix-ci.$suffix"
          fi

          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "is_release=$is_release"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

  install:
    needs: meta
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MaaFramework and submodules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/install_3_maafw.py

      - name: Prepare bundled Python and backend dependencies
        id: bundled_python
        shell: bash
        run: python tools/install_2_backend.py --github-output "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Build install payload
        shell: bash
        env:
          BUNDLED_PYTHON_DIR: .portable/python
          BUNDLED_PYTHON_EXEC_RELPATH: ${{ steps.bundled_python.outputs.python_exec_relpath }}
        run: |
          python tools/install.py ${{ needs.meta.outputs.tag }}

      - uses: actions/upload-artifact@v6
        with:
          name: MaaAlibabaSupplier-win-x86_64
          path: install
          retention-days: 1

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs:
      - meta
      - install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - shell: bash
        run: |
          cd assets
          for f in *; do
            (cd "$f" && zip -r "../$f-${{ needs.meta.outputs.tag }}.zip" .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
