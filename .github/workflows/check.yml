name: Check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "backend/**"
      - "frontend/**"
      - "tools/**"
      - "pytest.ini"
      - "conftest.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "backend/**"
      - "frontend/**"
      - "tools/**"
      - "pytest.ini"
      - "conftest.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run maa-checker
        working-directory: backend
        run: |
          npm ci
          npx @nekosu/maa-tools check

      - name: Validate JSON Schema
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py

  backend:
    needs: resource
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/app/requirements.txt pytest

      - name: Verify test isolation entry points
        run: |
          python -X utf8 tools/verify_pytest_isolation.py

      - name: Verify standalone CRM SDK
        run: |
          python -X utf8 tools/verify_crm_sdk_standalone.py

      - name: Run tests
        run: |
          python -X utf8 -m pytest -c pytest.ini backend/tests backend/app/crm_sdk/tests

  frontend:
    needs: resource
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck
        run: pnpm typecheck
        working-directory: frontend

      - name: Unit tests
        run: pnpm test
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend
