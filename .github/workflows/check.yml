name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "backend/assets/**"
      - "backend/**/*.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "backend/assets/**"
      - "backend/**/*.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run maa-checker
        run: |
          npm ci --prefix backend
          npx --prefix backend @nekosu/maa-tools check

      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade maafw --pre

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir backend/deps/tools --resource-dirs backend/assets/resource --exclude-dirs backend/assets/resource/announcement --interface-files backend/assets/interface.json
